# Builds the single DaliCandy.vst3 on Windows (what Ableton Live on Windows needs), runs the tests and pluginval,
# and uploads the plug-in as a downloadable artifact.  NOT YET RUN - this file was written on Linux without access to
# GitHub Actions; the first run may need small fixes (see Docs/CONTINUATION.md).
name: build
on: [push, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get JUCE 8.0.8
        run: git clone --depth 1 --branch 8.0.8 https://github.com/juce-framework/JUCE.git External/JUCE
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build plug-in and tests
        run: cmake --build build --config Release --target DaliCandy_VST3 DaliCandyTests --parallel
      - name: Unit tests
        run: build/DaliCandyTests_artefacts/Release/DaliCandyTests.exe
      - name: pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pv.zip
          Expand-Archive pv.zip -DestinationPath pv
          ./pv/pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 300000 "build/DaliCandy_artefacts/Release/VST3/DaliCandy.vst3"
      - uses: actions/upload-artifact@v4
        with:
          name: DaliCandy-windows-vst3
          path: build/DaliCandy_artefacts/Release/VST3/DaliCandy.vst3
